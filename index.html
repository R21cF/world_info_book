<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Info Book</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" href="data/countries.geojson" as="fetch" crossorigin />

    <!-- Vercel Speed Insights + Web Analytics -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="map">
      <canvas id="map-canvas" aria-label="World map: click a country for details"></canvas>
      <div id="map-zoom-controls">
        <button type="button" class="map-zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" class="map-zoom-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
      </div>
      <div id="country-popup"></div>
    </div>

    <div id="app-title" class="glass">🌍 World Info Book</div>

    <a id="github-link" class="glass" href="https://github.com/R21cF/world_info_book" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
      </svg>
      GitHub
    </a>

    <div id="chat-tooltip">💡 Ask me anything about any country!</div>

    <button type="button" id="chat-toggle" aria-label="Open chat assistant" aria-controls="chat-panel" aria-expanded="false">
      <span class="chat-toggle-icon chat-icon-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </span>
      <span class="chat-toggle-icon chat-icon-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </span>
    </button>

    <div id="chat-panel">
      <div class="chat-header">Country Chat Assistant</div>
      <div id="chat-messages">
        <div class="chat-placeholder">Ask me about any country!</div>
      </div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Type your question..." autocomplete="off" maxlength="2000" />
        <button id="chat-send" type="submit">Send</button>
      </form>
    </div>

    <script defer src="vendor/d3.min.js"></script>
    <script type="module" src="js/map.js"></script>
    <script type="module" src="js/chat.js"></script>  </body>
</html>
